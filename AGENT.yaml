name: rels-scripts
mission: Provide a shared CLI that standardises lint/test/build tooling across rels-* front-end apps.
documentation:
  overview: docs/overview.md
  maintenance: docs/maintenance.md
entry_points:
  cli: bin/rels-scripts.js
  configs:
    - config/webpack.config.js
    - config/.eslintrc.js
    - config/.prettierrc.yml
commands:
  setup:
    description: Install dependencies and link rels-scripts for local development.
    steps:
      - run: npm install
  lint:
    description: Run eslint with the shared config.
    steps:
      - run: npm run lint
  format:
    steps:
      - run: npm run format
  test:
    description: Execute mocha using config/.mocharc.js (watch disabled in CI).
    steps:
      - run: npm test
  start:
    description: Launch webpack-dev-server with HTTPS enabled.
    steps:
      - run: npx rels-scripts start
  build:
    description: Produce an optimized build with semantic-release metadata injected.
    steps:
      - run: npx rels-scripts build
notes:
  - Always run `npx rels-scripts init` (or `pnpm exec rels-scripts init`) inside consuming apps to install husky and VS Code settings.
  - `config/versioning.js` depends on git tags; make sure the repo has commit history available before running `start` or `build`.
  - Default semantic-release execution is a dry run, so publishing new packages still requires manual version bumping and `npm publish`/`pnpm publish`.
