language: node_js
dist: xenial
node_js:
  - 17
cache:
  directories:
    - $HOME/.pnpm-store
install:
  - corepack enable
  - corepack pnpm install --frozen-lockfile
script: corepack pnpm exec run-p lint format test
after_success:
  - corepack pnpm exec semantic-release
notifications:
  email: false
